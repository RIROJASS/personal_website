    Publications:
      - title: "Shortkit-ML: A Unified Multi-Perspective Framework for Detecting Shortcut Learning in Medical Imaging Embeddings"
        authors:
          - Sebastian Cajas
          - Aldo Marzullo
          - Sahil Kapadia
          - Filipe Santos
          - Felipe Ocampo Osorio
          - Qingpeng Kong
          - Alessandro Quarta
          - Po-Chih Kuo
          - Milit Patel
          - Raúl Ignacio Rojas Sillery
          - Leo Anthony Celi
        publisher: IEEE Access (in review); preprint on medRxiv
        releaseDate: 2026
        url: https://www.medrxiv.org/content/10.64898/2026.04.29.26352053v1
        summary: Unified framework to detect, benchmark, and mitigate shortcut learning in ML models — across medical imaging and beyond. 20+ detection methods plus 6 mitigation techniques under one API, benchmarked on CheXpert, MIMIC-CXR, and CelebA. Released on PyPI under MIT License. My contribution was the unifying ontology bridging anthropological and ML definitions of "shortcut."

      - title: "Credential Farming in the Age of Generative AI: Relocating Trust from Outputs to Communities"
        authors:
          - Gift Osei Agyemang
          - Rawad AL-Louzi
          - Melat Mezgebu Bawoke
          - Connor Bender
          - Leo Anthony Celi
          - Nishita Chavan
          - Rahul Gorijavolu
          - Diego Halac
          - Nikhil Jaiswal
          - Sofiya Mikolutskaya
          - Anthony Nguyen
          - Raúl Ignacio Rojas Sillery
          - Sparsh Roy
          - Dharaa Suresha
          - Alexa Q. Xiang
          - Boya Zhang
        publisher: Manuscript submitted
        releaseDate: 2026
        summary: Generative AI has weakened the inference from research outputs to the competencies they were meant to signal — producing a gaming dynamic where effort shifts toward optimizing the credential rather than the learning behind it. The paper argues academic trust must relocate from manufactured outputs to formation inside research communities. Authors listed alphabetically by surname.

      - title: "Community Auditing of Health AI in Low- and Middle-Income Countries: The SAKSHI Investigative Protocol"
        authors:
          - Alexa Q. Xiang
          - Alexander Cole Bank
          - Josephine Nanyonjo
          - Milit S. Patel
          - Mkliwa Koumbia
          - Rahul Gorijavolu
          - Nikhil Jaiswal
          - Noushin Nazarian
          - Rawad AL-Louzi
          - Soham Biren Katlariwala
          - Kaushik Madapati
          - Hillary Clinton Kasimbazi
          - Cecilia Cocucci
          - Diego Halac
          - Raúl Ignacio Rojas Sillery
          - Leo Anthony Celi
          - and others
        publisher: Manuscript submitted
        releaseDate: 2026
        summary: SAKSHI (Structured Accountability through Knowledge, Scrutiny, and Health Integrity) is a community-operated investigative platform supplying independent scrutiny of health-AI deployment in LMICs — settings where regulatory frameworks have not kept pace with autonomous diagnostic and prescribing tools, and where tort systems offer little recourse for patients who are harmed.

      - title: "Hallucinations Are the Least of Our Concerns: Situating Knowledge for Responsible AI in Health"
        authors:
          - Alexa Q. Xiang
          - Andres Rico
          - Biruk Zenebe Bekele
          - Bita Behrouzi
          - Boya Zhang
          - Cecilia Cocucci
          - Diego Halac
          - Jennifer Ziegler
          - Jie Song
          - Josephine Nanyonjo
          - Leo Anthony Celi
          - Raúl Ignacio Rojas Sillery
          - and others
        publisher: Manuscript in preparation
        releaseDate: 2026
        summary: Argues that situated knowledge — not reference-checking — is the prerequisite for responsible LLM use in health. Reframes "hallucinations" as a secondary concern compared to the deeper gap between model outputs and the local knowledge contexts where health decisions actually land.

      - title: "The Oracle in Your Pocket: How AI May Amplify the Dunning-Kruger Effect and Why Epistemic Humility Matters"
        authors:
          - Rogers Mwavu
          - Cecilia Cocucci
          - Sofiya Mikolutskaya
          - Diego Halac
          - Mohammad Ahmad Abdelaziz Al-Zu'bi
          - Raúl Ignacio Rojas Sillery
          - Konrad Bertram
          - Alexa Q. Xiang
          - Sparsh Roy
          - Elizabeth Louie
          - Joël Hanhart
          - Rawad AL-Louzi
          - Leo Anthony Celi
        publisher: Manuscript in preparation (submission not yet confirmed)
        releaseDate: 2026
        summary: Examines how repeated use of LLMs may alter users' perceptions of their own expertise. Draws on cognitive science (Dunning-Kruger, metacognition, cognitive offloading, cognitive surrender) to argue for epistemic humility and sharper AI literacy — with emphasis on health misinformation, Indigenous knowledge systems, and science communication.

      - title: "AGORA Peer Review: A Measurement-First Architecture for Auditable Scientific Agent Systems"
        authors:
          - AGORA Working Group, MIT Critical Data
        publisher: In development
        releaseDate: 2026
        summary: An experimental research programme for studying AI-mediated scientific peer review as an auditable multi-agent system. On the team; contributing to early-stage work.

